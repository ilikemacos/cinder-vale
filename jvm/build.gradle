plugins {
    id 'application'
}

group = 'com.cindervale'
version = '0.5'

repositories {
    mavenCentral()
}

ext {
    jmeVersion = '3.6.1-stable'
}

dependencies {
    // jMonkeyEngine core + LWJGL3 backend (LWJGL3 has macOS arm64 natives; LWJGL2 does not).
    implementation "org.jmonkeyengine:jme3-core:${jmeVersion}"
    implementation "org.jmonkeyengine:jme3-desktop:${jmeVersion}"
    implementation "org.jmonkeyengine:jme3-lwjgl3:${jmeVersion}"
    // glTF loading (for the reconverted Mixamo characters, later phases).
    implementation "org.jmonkeyengine:jme3-plugins:${jmeVersion}"
    implementation "org.jmonkeyengine:jme3-effects:${jmeVersion}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'com.cindervale.Main'
    // macOS requires GLFW/LWJGL to run on the first thread. Cap heap for the 8GB M1.
    applicationDefaultJvmArgs = ['-XstartOnFirstThread', '-Xmx2g']
}

run {
    standardInput = System.in
    // Forward -D system properties from the Gradle CLI (for the autoshot hook).
    ['cindervale.autoshot', 'cindervale.shotpath'].each { k ->
        if (project.hasProperty(k)) systemProperty k, project.property(k)
        if (System.getProperty(k) != null) systemProperty k, System.getProperty(k)
    }
}

// Runs the Lunar-style launcher (spawns the game as a child process).
task runLauncher(type: JavaExec) {
    group = 'application'
    description = 'Launch the Cinder Vale front-end launcher'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.cindervale.launcher.LauncherMain'
    standardInput = System.in
}

task printClasspath {
    doLast {
        println(sourceSets.main.runtimeClasspath.asPath)
    }
}

// -----------------------------------------------------------------------------
// Standalone packaging: Launcher.app  (Lunar-Client-style external app)
// -----------------------------------------------------------------------------
// Two-step build:
//   1) fatJar   — one shaded jar with launcher + game + every runtime dep,
//                 plus the Poly Haven assets bundled from src/main/resources.
//   2) jpackage — invokes JDK 21's jpackage on that jar to produce a real .app
//                 with a trimmed JRE bundled inside (no user Java needed).
// The launcher (Swing/AWT) is the app's main; PLAY spawns the game as a child
// process using the SAME bundled JRE (via System.getProperty("java.home")) and
// passes -XstartOnFirstThread which JME requires but AWT would break on.
// -----------------------------------------------------------------------------

task fatJar(type: Jar) {
    group = 'application'
    description = 'Shaded launcher+game+deps+assets jar (input for jpackage).'
    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': 'com.cindervale.launcher.LauncherMain'
    }
    from sourceSets.main.output   // compiled classes + resources (assets)
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.findAll { it.name.endsWith('.jar') }
                                        .collect { zipTree(it) }
    }
    // JAR signatures from bundled deps would break jarsigner/jpackage.
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/versions/*/module-info.class'
}

task jpackageApp(type: Exec) {
    group = 'application'
    description = 'Bundle Launcher.app with a trimmed JRE via JDK jpackage.'
    dependsOn fatJar

    def dist = layout.buildDirectory.dir('dist').get().asFile
    def input = layout.buildDirectory.dir('libs').get().asFile

    doFirst {
        // Clean prior output so jpackage doesn't refuse the destination.
        delete fileTree(dist) {
            include '**/Cinder Vale Launcher.app/**'
            include 'Cinder Vale Launcher.app'
        }
        dist.mkdirs()
    }

    def javaHome = System.getProperty('java.home')
    commandLine "${javaHome}/bin/jpackage",
            '--type', 'app-image',
            '--name', 'Cinder Vale Launcher',
            // macOS jpackage requires the first version segment > 0.
            '--app-version', '1.0.0',
            '--vendor', 'Cinder Vale',
            '--input', input.absolutePath,
            '--main-jar', "cinder-vale-jvm-${version}-all.jar",
            '--main-class', 'com.cindervale.launcher.LauncherMain',
            '--dest', dist.absolutePath,
            // Bundle the FULL JDK, not a trimmed runtime — the launcher spawns
            // the game as a child process using $JAVA_HOME/bin/java, and
            // jpackage's default trimmed runtime omits the java binary.
            '--runtime-image', javaHome,
            // Launcher is Swing/AWT — it must NOT get -XstartOnFirstThread here.
            // The launcher itself passes that arg when it spawns the game child.
            '--java-options', '-Xmx512m',
            '--mac-package-name', 'CinderVale'
}

// Convenience: run the packaged .app after building it (skips gradle when used).
task runInstalledApp(type: Exec) {
    group = 'application'
    description = 'Launch the packaged Cinder Vale Launcher.app'
    dependsOn jpackageApp
    def app = layout.buildDirectory.dir('dist/Cinder Vale Launcher.app').get().asFile
    commandLine 'open', app.absolutePath
}
